<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Unterrichtsstart</title>
<style>
:root{
  --bg1:#f7efe6;
  --bg2:#ead9c6;
  --ink:#3f3028;
  --coffee:#6b3f27;
  --coffee2:#8d5a38;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 20% 18%,rgba(255,255,255,.82),transparent 34%),
    linear-gradient(145deg,var(--bg1),var(--bg2));
}
.stage{
  height:100%;
  padding:clamp(28px,5vw,72px);
  display:grid;
  grid-template-columns:minmax(0,1fr) 360px;
  align-items:center;
  gap:36px;
}
.copy{max-width:1000px;align-self:center}
.kicker{
  margin-bottom:18px;
  font-size:clamp(17px,1.8vw,25px);
  letter-spacing:.09em;
  text-transform:uppercase;
  opacity:.58;
}
h1{
  margin:0;
  max-width:900px;
  font-size:clamp(52px,7vw,108px);
  line-height:.96;
  letter-spacing:-.045em;
}
.sub{
  max-width:800px;
  margin-top:26px;
  font-size:clamp(22px,2.4vw,34px);
  line-height:1.32;
  opacity:.77;
}
.qr-card{
  justify-self:end;
  width:330px;
  padding:22px;
  border-radius:28px;
  background:rgba(255,255,255,.86);
  box-shadow:0 20px 60px rgba(70,45,25,.16);
  text-align:center;
  backdrop-filter:blur(10px);
}
.qr-title{font-size:23px;font-weight:750;margin-bottom:14px}
#qrcode{width:268px;height:268px;margin:auto}
#qrcode img,#qrcode canvas{width:268px!important;height:268px!important}
.qr-note{margin-top:12px;font-size:15px;opacity:.68}
.coffee-area{
  position:fixed;
  right:clamp(26px,5vw,78px);
  bottom:clamp(16px,3vw,40px);
  width:min(430px,38vw);
  height:min(340px,36vh);
  pointer-events:none;
}
.kettle{
  position:absolute;
  right:130px;
  top:0;
  width:180px;
  height:118px;
  transform-origin:80% 65%;
  animation:tilt 2.8s ease-in-out infinite;
}
.kettle-body{
  position:absolute;right:5px;top:20px;width:110px;height:80px;
  background:#3a3431;border-radius:42% 48% 44% 42%;
  box-shadow:inset 0 0 0 8px rgba(255,255,255,.07);
}
.kettle-handle{
  position:absolute;right:-29px;top:29px;width:59px;height:54px;
  border:10px solid #3a3431;border-left:0;border-radius:0 50% 50% 0;
}
.kettle-spout{
  position:absolute;left:0;top:42px;width:82px;height:27px;
  background:#3a3431;clip-path:polygon(100% 0,100% 100%,0 58%);
}
.stream{
  position:absolute;left:84px;top:92px;width:7px;height:122px;border-radius:8px;
  background:linear-gradient(var(--coffee2),var(--coffee));
  transform:rotate(15deg);animation:flow 2.8s ease-in-out infinite;
}
.cup-wrap{position:absolute;right:0;bottom:0;width:245px;height:188px}
.saucer{
  position:absolute;left:-18px;bottom:0;width:240px;height:28px;border-radius:50%;
  background:#e2d9cf;box-shadow:0 12px 24px rgba(70,45,25,.13);
}
.handle{
  position:absolute;right:0;bottom:42px;width:76px;height:78px;
  border:14px solid #eee7de;border-left:0;border-radius:0 40px 40px 0;
}
.cup{
  position:absolute;left:0;bottom:8px;width:190px;height:140px;
  border:9px solid #eee7de;border-top:7px solid #ddd4ca;
  border-radius:10px 10px 64px 64px;background:#fffdf8;overflow:hidden;
  box-shadow:0 18px 30px rgba(70,45,25,.14);
}
.fill{
  position:absolute;left:0;right:0;bottom:0;height:0%;
  background:linear-gradient(#8d5938,#623820);
  transition:height .8s cubic-bezier(.2,.8,.2,1);
}
.fill:before{
  content:"";position:absolute;left:0;right:0;top:-7px;height:15px;
  border-radius:50%;background:#a46d49;
}
#teacher{
  position:fixed;left:18px;bottom:18px;padding:10px 14px;border-radius:14px;
  background:rgba(44,39,36,.9);color:white;font-size:15px;
  opacity:0;transform:translateY(8px);transition:.22s ease;pointer-events:none;
}
#teacher.show{opacity:1;transform:translateY(0)}
#status{
  position:fixed;right:16px;top:16px;width:11px;height:11px;border-radius:50%;
  background:#aaa19a;box-shadow:0 0 0 4px rgba(255,255,255,.55);
}
#status.ok{background:#5f9a6b}
#status.err{background:#b95c54}
@keyframes tilt{
  0%,100%{transform:rotate(-11deg)}
  35%,70%{transform:rotate(-19deg)}
}
@keyframes flow{
  0%,100%{opacity:.35;transform:rotate(15deg) scaleY(.72)}
  35%,70%{opacity:1;transform:rotate(15deg) scaleY(1)}
}
@media(max-width:900px){
  .stage{grid-template-columns:1fr;align-items:start;padding:28px}
  .qr-card{justify-self:start;width:290px}
  #qrcode,#qrcode img,#qrcode canvas{width:230px!important;height:230px!important}
  .coffee-area{width:320px;right:8px}
}
</style>
</head>
<body>
<div id="status" title="Live Verbindung"></div>
<main class="stage">
  <section class="copy">
    <div class="kicker">Unterrichtsstart</div>
    <h1>Herzlich willkommen zur heutigen Sitzung</h1>
    <div class="sub">Scanne den QR Code und ordne die Aussagen zu BIP, HDI und HPI richtig zu.</div>
  </section>
  <aside class="qr-card">
    <div class="qr-title">Zur Aufgabe</div>
    <div id="qrcode"></div>
    <div class="qr-note">QR Code scannen</div>
  </aside>
</main>

<div class="coffee-area" aria-hidden="true">
  <div class="kettle">
    <div class="kettle-spout"></div>
    <div class="kettle-body"></div>
    <div class="kettle-handle"></div>
    <div class="stream"></div>
  </div>
  <div class="cup-wrap">
    <div class="saucer"></div>
    <div class="handle"></div>
    <div class="cup"><div id="fill" class="fill"></div></div>
  </div>
</div>

<div id="teacher"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const API_BASE = "https://ndosnzmwcqvuwkijskmr.supabase.co/functions/v1/coffee-live";
const FULL_AT = 7;
const studentUrl = new URL("schueler.html", window.location.href).href;

new QRCode(document.getElementById("qrcode"), {
  text: studentUrl,
  width: 268,
  height: 268,
  correctLevel: QRCode.CorrectLevel.H
});

const fill = document.getElementById("fill");
const teacher = document.getElementById("teacher");
const status = document.getElementById("status");

async function refreshCount(){
  try{
    const r = await fetch(API_BASE + "?api=count", {cache:"no-store"});
    if(!r.ok) throw new Error("API");
    const data = await r.json();
    const count = Number(data.count || 0);
    fill.style.height = Math.min(100, count / FULL_AT * 100) + "%";
    teacher.textContent = "Erfolgreiche Lösungen: " + count;
    status.className = "ok";
    status.title = "Live Verbindung aktiv";
  }catch(e){
    status.className = "err";
    status.title = "Live Verbindung nicht verfügbar";
  }
}

setInterval(refreshCount, 1200);
refreshCount();

document.addEventListener("keydown", e => {
  if(e.key.toLowerCase() === "t"){
    teacher.classList.add("show");
    clearTimeout(window.teacherTimer);
    window.teacherTimer = setTimeout(() => teacher.classList.remove("show"), 3000);
  }
});
</script>
</body>
</html>
