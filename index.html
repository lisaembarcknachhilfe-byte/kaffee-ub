<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Unterrichtsstart</title>
<style>
:root{
  --bg1:#f7efe6;
  --bg2:#ead9c6;
  --ink:#3f3028;
  --coffee:#6b3f27;
  --coffee2:#8d5a38;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 20% 18%,rgba(255,255,255,.82),transparent 34%),
    linear-gradient(145deg,var(--bg1),var(--bg2));
}
.stage{
  height:100%;
  padding:clamp(28px,5vw,72px);
  display:grid;
  grid-template-columns:minmax(0,1fr) 360px;
  align-items:center;
  gap:36px;
}
.copy{max-width:1000px;align-self:center}
.kicker{
  margin-bottom:18px;
  font-size:clamp(17px,1.8vw,25px);
  letter-spacing:.09em;
  text-transform:uppercase;
  opacity:.58;
}
h1{
  margin:0;
  max-width:900px;
  font-size:clamp(52px,7vw,108px);
  line-height:.96;
  letter-spacing:-.045em;
}
.sub{
  max-width:800px;
  margin-top:26px;
  font-size:clamp(22px,2.4vw,34px);
  line-height:1.32;
  opacity:.77;
}
.qr-card{
  justify-self:end;
  width:330px;
  padding:22px;
  border-radius:28px;
  background:rgba(255,255,255,.86);
  box-shadow:0 20px 60px rgba(70,45,25,.16);
  text-align:center;
  backdrop-filter:blur(10px);
}
.qr-title{font-size:23px;font-weight:750;margin-bottom:14px}
#qrcode{width:268px;height:268px;margin:auto}
#qrcode img,#qrcode canvas{width:268px!important;height:268px!important}
.qr-note{margin-top:12px;font-size:15px;opacity:.68}
.coffee-area{
  position:fixed;
  left:clamp(56%,60vw,64%);
  bottom:clamp(18px,3vh,42px);
  width:330px;
  height:300px;
  transform:translateX(-50%);
  pointer-events:none;
  z-index:2;
}
.kettle{
  position:absolute;
  left:38px;
  top:10px;
  width:190px;
  height:130px;
  transform-origin:78% 62%;
  animation:tilt 3s ease-in-out infinite;
  filter:drop-shadow(0 14px 14px rgba(65,45,30,.13));
}
.kettle svg{width:100%;height:100%;display:block;overflow:visible}
.stream{
  position:absolute;
  left:137px;
  top:113px;
  width:7px;
  height:92px;
  border-radius:8px;
  background:linear-gradient(var(--coffee2),var(--coffee));
  transform:rotate(9deg);
  transform-origin:top center;
  animation:flow 3s ease-in-out infinite;
  box-shadow:0 0 5px rgba(107,63,39,.16);
}
.cup-wrap{
  position:absolute;
  right:12px;
  bottom:0;
  width:220px;
  height:166px;
}
.saucer{
  position:absolute;
  left:-16px;
  bottom:0;
  width:215px;
  height:26px;
  border-radius:50%;
  background:linear-gradient(#eee6dc,#dcd2c7);
  box-shadow:0 12px 24px rgba(70,45,25,.12);
}
.handle{
  position:absolute;
  right:0;
  bottom:39px;
  width:68px;
  height:69px;
  border:13px solid #efe8df;
  border-left:0;
  border-radius:0 38px 38px 0;
}
.cup{
  position:absolute;
  left:0;
  bottom:7px;
  width:174px;
  height:128px;
  border:9px solid #efe8df;
  border-top:7px solid #dcd3c9;
  border-radius:12px 12px 58px 58px;
  background:#fffdf8;
  overflow:hidden;
  box-shadow:0 18px 30px rgba(70,45,25,.13);
}
.fill{
  position:absolute;
  left:0;right:0;bottom:0;
  height:0%;
  background:linear-gradient(#8d5938,#623820);
  transition:height .8s cubic-bezier(.2,.8,.2,1);
}
.fill:before{
  content:"";
  position:absolute;
  left:0;right:0;
  top:-7px;
  height:15px;
  border-radius:50%;
  background:#a46d49;
}
@keyframes tilt{
  0%,100%{transform:translateY(0) rotate(-7deg)}
  40%,68%{transform:translateY(-3px) rotate(-14deg)}
}
@keyframes flow{
  0%,100%{opacity:.15;transform:rotate(9deg) scaleY(.7)}
  38%,70%{opacity:.95;transform:rotate(9deg) scaleY(1)}
}
  35%,70%{opacity:1;transform:rotate(15deg) scaleY(1)}
}
@media(max-width:900px){
  .stage{grid-template-columns:1fr;align-items:start;padding:28px}
  .qr-card{justify-self:start;width:290px}
  #qrcode,#qrcode img,#qrcode canvas{width:230px!important;height:230px!important}
  .coffee-area{width:290px;left:67%;right:auto;bottom:8px;transform:translateX(-50%) }
}
</style>
</head>
<body>
<div id="status" title="Live Verbindung"></div>
<main class="stage">
  <section class="copy">
    <div class="kicker">Unterrichtsstart</div>
    <h1>Herzlich willkommen zur heutigen Sitzung</h1>
    <div class="sub">Scanne den QR Code und ordne die Aussagen zu BIP, HDI und HPI richtig zu.</div>
  </section>
  <aside class="qr-card">
    <div class="qr-title">Zur Aufgabe</div>
    <div id="qrcode"></div>
    <div class="qr-note">QR Code scannen</div>
  </aside>
</main>

<div class="coffee-area" aria-hidden="true">
  <div class="kettle">
    <svg viewBox="0 0 220 150" aria-hidden="true">
      <defs>
        <linearGradient id="potBody" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#514944"/>
          <stop offset="1" stop-color="#2f2a27"/>
        </linearGradient>
        <linearGradient id="potShine" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#756a63" stop-opacity=".85"/>
          <stop offset=".7" stop-color="#514944" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <path d="M78 39 C91 24 139 22 157 36 C170 46 178 79 169 96 C159 116 93 119 76 99 C63 84 65 54 78 39Z" fill="url(#potBody)"/>
      <path d="M77 53 C45 54 29 67 11 79 L9 67 C28 50 47 42 76 40Z" fill="#332d2a"/>
      <path d="M159 44 C192 29 211 52 202 80 C198 94 186 103 171 104" fill="none" stroke="#332d2a" stroke-width="15" stroke-linecap="round"/>
      <path d="M93 33 C103 18 136 16 146 31" fill="none" stroke="#2e2926" stroke-width="10" stroke-linecap="round"/>
      <ellipse cx="118" cy="42" rx="38" ry="11" fill="#26221f"/>
      <ellipse cx="118" cy="44" rx="28" ry="6" fill="#6b5f58"/>
      <path d="M87 46 C98 37 126 35 145 43 C127 46 106 50 87 64Z" fill="url(#potShine)"/>
      <circle cx="142" cy="58" r="5" fill="#8a7f77" opacity=".55"/>
    </svg>
    <div class="stream"></div>
  </div>
  <div class="cup-wrap">
    <div class="saucer"></div>
    <div class="handle"></div>
    <div class="cup"><div id="fill" class="fill"></div></div>
  </div>
</div>

<div id="teacher"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const API_BASE = "https://ndosnzmwcqvuwkijskmr.supabase.co/functions/v1/coffee-live";
const FULL_AT = 7;
const studentUrl = new URL("schueler.html", window.location.href).href;

new QRCode(document.getElementById("qrcode"), {
  text: studentUrl,
  width: 268,
  height: 268,
  correctLevel: QRCode.CorrectLevel.H
});

const fill = document.getElementById("fill");
const teacher = document.getElementById("teacher");
const status = document.getElementById("status");

async function refreshCount(){
  try{
    const r = await fetch(API_BASE + "?api=count", {cache:"no-store"});
    if(!r.ok) throw new Error("API");
    const data = await r.json();
    const count = Number(data.count || 0);
    fill.style.height = Math.min(100, count / FULL_AT * 100) + "%";
    teacher.textContent = "Erfolgreiche Lösungen: " + count;
    status.className = "ok";
    status.title = "Live Verbindung aktiv";
  }catch(e){
    status.className = "err";
    status.title = "Live Verbindung nicht verfügbar";
  }
}

setInterval(refreshCount, 1200);
refreshCount();

document.addEventListener("keydown", e => {
  if(e.key.toLowerCase() === "t"){
    teacher.classList.add("show");
    clearTimeout(window.teacherTimer);
    window.teacherTimer = setTimeout(() => teacher.classList.remove("show"), 3000);
  }
});
</script>
</body>
</html>
