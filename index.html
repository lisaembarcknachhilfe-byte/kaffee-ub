<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Unterrichtsstart</title>
<style>
:root{
  --bg1:#f7efe6;
  --bg2:#ead9c6;
  --ink:#3f3028;
  --coffee:#6b3f27;
  --coffee2:#8d5a38;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 20% 18%,rgba(255,255,255,.82),transparent 34%),
    linear-gradient(145deg,var(--bg1),var(--bg2));
}
.stage{
  height:100%;
  padding:clamp(28px,5vw,72px);
  display:grid;
  grid-template-columns:minmax(0,1fr) 360px;
  align-items:center;
  gap:36px;
}
.copy{max-width:1000px;align-self:center}
.kicker{
  margin-bottom:18px;
  font-size:clamp(17px,1.8vw,25px);
  letter-spacing:.09em;
  text-transform:uppercase;
  opacity:.58;
}
h1{
  margin:0;
  max-width:900px;
  font-size:clamp(52px,7vw,108px);
  line-height:.96;
  letter-spacing:-.045em;
}
.sub{
  max-width:800px;
  margin-top:26px;
  font-size:clamp(22px,2.4vw,34px);
  line-height:1.32;
  opacity:.77;
}
.qr-card{
  justify-self:end;
  width:330px;
  padding:22px;
  border-radius:28px;
  background:rgba(255,255,255,.86);
  box-shadow:0 20px 60px rgba(70,45,25,.16);
  text-align:center;
  backdrop-filter:blur(10px);
}
.qr-title{font-size:23px;font-weight:750;margin-bottom:14px}
#qrcode{width:268px;height:268px;margin:auto}
#qrcode img,#qrcode canvas{width:268px!important;height:268px!important}
.qr-note{margin-top:12px;font-size:15px;opacity:.68}
.coffee-area{
  position:fixed;
  right:clamp(34px,6vw,94px);
  bottom:clamp(10px,2vw,28px);
  width:min(430px,36vw);
  height:min(360px,38vh);
  pointer-events:none;
  z-index:1;
}
.pot{
  position:absolute;
  right:68px;
  top:0;
  width:210px;
  height:162px;
  transform-origin:82% 44%;
  animation:tilt 3.2s ease-in-out infinite;
  filter:drop-shadow(0 16px 20px rgba(63,41,24,.22));
}
.pot svg{width:100%;height:100%;display:block;overflow:visible}
.stream{
  position:absolute;
  right:266px;
  top:64px;
  width:9px;
  height:188px;
  border-radius:999px;
  background:linear-gradient(180deg,#a56837 0,#6b3f24 45%,#3f2417 100%);
  transform:rotate(-40deg);
  transform-origin:top center;
  animation:flow 3.2s ease-in-out infinite;
  box-shadow:0 0 8px rgba(106,64,36,.14);
}
.cup-wrap{
  position:absolute;
  right:0;
  bottom:0;
  width:242px;
  height:184px;
}
.saucer{
  position:absolute;
  left:6px;
  right:6px;
  bottom:0;
  height:30px;
  border-radius:50%;
  background:linear-gradient(180deg,#f0e6d8 0,#d8c5ad 100%);
  box-shadow:0 14px 26px rgba(68,44,25,.14);
}
.cup{
  position:absolute;
  left:18px;
  bottom:20px;
  width:178px;
  height:124px;
  border-radius:20px 20px 54px 54px;
  background:linear-gradient(180deg,#f2eadf 0,#e0cfbb 72%,#ccb08d 100%);
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.48),0 18px 30px rgba(68,44,25,.18);
  overflow:hidden;
}
.cup::before{
  content:"";
  position:absolute;
  left:8px;
  right:8px;
  top:8px;
  height:16px;
  border-radius:50%;
  background:linear-gradient(180deg,#ebe0d0,#d7bea0);
  z-index:3;
}
.cup::after{
  content:"";
  position:absolute;
  inset:0;
  border-radius:20px 20px 54px 54px;
  box-shadow:inset 0 -14px 18px rgba(114,84,49,.12);
}
.handle{
  position:absolute;
  right:6px;
  bottom:52px;
  width:60px;
  height:62px;
  border:11px solid #6a5036;
  border-left:0;
  border-radius:0 36px 36px 0;
  opacity:.92;
}
.fill{
  position:absolute;
  left:10px;
  right:10px;
  bottom:9px;
  height:0%;
  background:linear-gradient(180deg,#7b4a2f 0,#4f2d1d 100%);
  border-radius:0 0 44px 44px;
  transition:height .9s cubic-bezier(.2,.8,.2,1);
}
.fill::before{
  content:"";
  position:absolute;
  left:0;
  right:0;
  top:-10px;
  height:20px;
  border-radius:50%;
  background:linear-gradient(180deg,#6a4029,#3a2418);
  box-shadow:inset 0 2px 2px rgba(255,255,255,.08);
}
.steam{
  position:absolute;
  width:52px;
  height:92px;
  bottom:118px;
  left:88px;
  opacity:.5;
  filter:blur(1.1px);
}
.steam span{
  position:absolute;
  left:50%;
  bottom:0;
  width:14px;
  height:78px;
  margin-left:-7px;
  border-radius:50%;
  background:linear-gradient(to top,rgba(255,255,255,0),rgba(255,255,255,.62),rgba(255,255,255,0));
  animation:steam 4.1s ease-in-out infinite;
}
.steam span:nth-child(2){left:30%;height:70px;animation-delay:1.1s}
.steam span:nth-child(3){left:72%;height:74px;animation-delay:2.1s}
@keyframes tilt{
  0%,100%{transform:translateY(0) rotate(-10deg)}
  36%,70%{transform:translateY(-2px) rotate(-16deg)}
}
@keyframes flow{
  0%,100%{opacity:.12;transform:rotate(-40deg) scaleY(.74)}
  34%,72%{opacity:.98;transform:rotate(-40deg) scaleY(1)}
}
@keyframes steam{
  0%{transform:translate(-6px,8px) scaleY(.7);opacity:0}
  25%{opacity:.45}
  65%{opacity:.6}
  100%{transform:translate(8px,-34px) scaleY(1.12);opacity:0}
}
@media(max-width:900px){
  .stage{grid-template-columns:1fr;align-items:start;padding:28px}
  .qr-card{justify-self:start;width:290px}
  #qrcode,#qrcode img,#qrcode canvas{width:230px!important;height:230px!important}
  .coffee-area{width:280px;height:250px;right:8px;bottom:8px}
  .pot{right:40px;top:0;width:150px;height:118px}
  .stream{right:174px;top:44px;height:136px;transform:rotate(-38deg)}
  .cup-wrap{width:180px;height:135px}
  .cup{left:10px;bottom:14px;width:136px;height:92px}
  .handle{right:0;bottom:40px;width:46px;height:44px;border-width:9px}
  .steam{left:52px;bottom:88px;height:60px}
}
</style>
</head>
<body>
<div id="status" title="Live Verbindung"></div>
<main class="stage">
  <section class="copy">
    <div class="kicker">Unterrichtsstart</div>
    <h1>Herzlich willkommen zur heutigen Sitzung</h1>
    <div class="sub">Scanne den QR Code und ordne die Aussagen zu BIP, HDI und HPI richtig zu.</div>
  </section>
  <aside class="qr-card">
    <div class="qr-title">Zur Aufgabe</div>
    <div id="qrcode"></div>
    <div class="qr-note">QR Code scannen</div>
  </aside>
</main>

<div class="coffee-area" aria-hidden="true">
  <div class="pot">
    <svg viewBox="0 0 240 180" aria-hidden="true">
      <defs>
        <linearGradient id="potGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#d0a268"/>
          <stop offset="0.5" stop-color="#956738"/>
          <stop offset="1" stop-color="#5c3e24"/>
        </linearGradient>
        <linearGradient id="potShine" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#fff5e2" stop-opacity=".82"/>
          <stop offset="1" stop-color="#fff5e2" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <path d="M108 28 C137 22 177 34 190 61 C203 89 201 114 186 135 C169 159 121 164 88 148 C56 132 47 83 61 56 C72 36 88 31 108 28 Z" fill="url(#potGrad)" stroke="#5a3a20" stroke-width="4"/>
      <path d="M72 54 C52 53 34 60 13 76 C12 71 12 67 14 63 C30 45 48 39 75 39 Z" fill="url(#potGrad)" stroke="#5a3a20" stroke-width="3" stroke-linejoin="round"/>
      <path d="M171 47 C197 32 223 50 219 84 C216 106 202 120 183 123" fill="none" stroke="#5a3a20" stroke-width="12" stroke-linecap="round"/>
      <ellipse cx="120" cy="40" rx="42" ry="12" fill="#5d3f24"/>
      <ellipse cx="121" cy="41" rx="27" ry="6" fill="#efc891" opacity=".7"/>
      <ellipse cx="154" cy="18" rx="14" ry="11" fill="#4a3220"/>
      <path d="M116 24 C124 8 146 6 160 16 C168 22 170 33 170 33" fill="none" stroke="#5a3a20" stroke-width="6" stroke-linecap="round"/>
      <path d="M92 46 C113 31 154 38 179 60 C159 58 126 66 93 92 Z" fill="url(#potShine)"/>
      <path d="M97 56 C112 53 128 53 145 57" fill="none" stroke="rgba(255,255,255,.28)" stroke-width="4" stroke-linecap="round"/>
    </svg>
  </div>
  <div class="stream"></div>
  <div class="cup-wrap">
    <div class="steam"><span></span><span></span><span></span></div>
    <div class="saucer"></div>
    <div class="handle"></div>
    <div class="cup"><div id="fill" class="fill"></div></div>
  </div>
</div>

<div id="teacher"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const API_BASE = "https://ndosnzmwcqvuwkijskmr.supabase.co/functions/v1/coffee-live";
const FULL_AT = 7;
const studentUrl = new URL("schueler.html", window.location.href).href;

new QRCode(document.getElementById("qrcode"), {
  text: studentUrl,
  width: 268,
  height: 268,
  correctLevel: QRCode.CorrectLevel.H
});

const fill = document.getElementById("fill");
const teacher = document.getElementById("teacher");
const status = document.getElementById("status");

async function refreshCount(){
  try{
    const r = await fetch(API_BASE + "?api=count", {cache:"no-store"});
    if(!r.ok) throw new Error("API");
    const data = await r.json();
    const count = Number(data.count || 0);
    fill.style.height = Math.min(100, count / FULL_AT * 100) + "%";
    teacher.textContent = "Erfolgreiche Lösungen: " + count;
    status.className = "ok";
    status.title = "Live Verbindung aktiv";
  }catch(e){
    status.className = "err";
    status.title = "Live Verbindung nicht verfügbar";
  }
}

setInterval(refreshCount, 1200);
refreshCount();

document.addEventListener("keydown", e => {
  if(e.key.toLowerCase() === "t"){
    teacher.classList.add("show");
    clearTimeout(window.teacherTimer);
    window.teacherTimer = setTimeout(() => teacher.classList.remove("show"), 3000);
  }
});
</script>
</body>
</html>
